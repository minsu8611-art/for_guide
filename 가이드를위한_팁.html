<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가이드를 위한 팁</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#22262b; --muted:#6b7177; --line:#e2ded5;
  --pri:#1f5f5b; --pri-soft:#e3efed; --acc:#b5651d; --acc-soft:#f6e9dc;
  --ok:#2e7d4f; --ok-soft:#e2f2e8; --chk:#a33a2b; --chk-soft:#f7e3df; --gen:#5a6270; --gen-soft:#eceef1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16191c; --card:#1f2327; --ink:#e7e9eb; --muted:#9aa1a8; --line:#30363c;
    --pri:#6fbab3; --pri-soft:#1f3432; --acc:#e0a062; --acc-soft:#3a2c1f;
    --ok:#7bcf9c; --ok-soft:#1f3328; --chk:#ef9a8c; --chk-soft:#3d2420; --gen:#b3bac4; --gen-soft:#2a2f35;
  }
}
:root[data-theme="dark"]{
  --bg:#16191c; --card:#1f2327; --ink:#e7e9eb; --muted:#9aa1a8; --line:#30363c;
  --pri:#6fbab3; --pri-soft:#1f3432; --acc:#e0a062; --acc-soft:#3a2c1f;
  --ok:#7bcf9c; --ok-soft:#1f3328; --chk:#ef9a8c; --chk-soft:#3d2420; --gen:#b3bac4; --gen-soft:#2a2f35;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.6;font-size:15px}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 80px}
header.top{padding:22px 0 8px}
header.top h1{margin:0;font-size:26px;letter-spacing:-.5px}
header.top p{margin:4px 0 0;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;margin:16px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--pri);border-bottom-color:var(--pri)}
.panel{display:none}.panel.on{display:block}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.axis{margin-bottom:10px}
.axis-label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.btn{border:1px solid var(--acc);background:var(--acc-soft);color:var(--acc);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.btn.ghost{border-color:var(--line);background:transparent;color:var(--muted)}
.search{flex:1;min-width:160px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin:4px 0 12px}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-general{background:var(--gen-soft);color:var(--gen)}.b-check{background:var(--chk-soft);color:var(--chk)}
.grp-h{font-size:13px;font-weight:800;color:var(--acc);margin:22px 0 8px;letter-spacing:.3px}
.sec-h{font-size:16px;font-weight:700;margin:0 0 6px;color:var(--pri)}
.sec-h small{color:var(--muted);font-weight:500;font-size:12px;margin-left:6px}
ul.tips{list-style:none;margin:0;padding:0}
ul.tips li{padding:8px 0;border-top:1px dashed var(--line)}
ul.tips li:first-child{border-top:0}
.t-main{font-weight:600}
.t-sub{color:var(--muted);font-size:13px}
.t-src{font-size:11px;color:var(--muted);margin-top:2px}
.t-src a{color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.pending{font-size:13px;color:var(--muted);background:var(--gen-soft);border-radius:8px;padding:8px 12px;margin-top:6px}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
details.sec summary{cursor:pointer;padding:12px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary .cnt{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.sec-body{padding:0 16px 14px}
.lbl{font-size:12px;font-weight:800;color:var(--acc);margin:12px 0 4px}
.scope{font-size:13px;color:var(--muted)}
ol.plain,ul.plain{margin:0;padding-left:20px;font-size:14px}
.ment{background:var(--pri-soft);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:6px}
.cat-h{font-size:13px;font-weight:700;color:var(--ink);margin:14px 0 2px}
.count{font-size:13px;color:var(--muted);margin-bottom:6px}
@media (max-width:520px){header.top h1{font-size:22px}.box{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="ttl"></h1>
    <p id="sub"></p>
  </header>

  <nav class="tabs">
    <button class="tab on" data-tab="p-build">팁 꺼내기</button>
    <button class="tab" data-tab="p-basic">기본 팁</button>
    <button class="tab" data-tab="p-store">자료창고</button>
  </nav>

  <section class="panel on" id="p-build">
    <div class="box">
      <div id="axes"></div>
      <div class="tools">
        <span id="presets"></span>
        <button class="btn ghost" id="reset">초기화</button>
        <input class="search" id="q" type="search" placeholder="검색 (예: 배터리, 면세)">
      </div>
    </div>
    <div class="legend">
      <span><span class="badge b-ok">검증</span> 웹 출처 확인</span>
      <span><span class="badge b-general">일반 원칙</span> 수치 없는 요령</span>
      <span><span class="badge b-check">확인 필요</span> 출처 약함</span>
    </div>
    <div id="result"></div>
  </section>

  <section class="panel" id="p-basic">
    <div class="box"><div class="scope">어떤 여행이든 조건과 관계없이 늘 통하는 팁입니다. '팁 꺼내기'에는 조건에 따라 달라지는 팁만 나옵니다.</div></div>
    <div id="basic"></div>
  </section>

  <section class="panel" id="p-store">
    <div id="store"></div>
  </section>

</div>

초과 제품은 기내 반입도 불가", "tags": {}, "status": "ok", "src": ["molit", "icn_items"]}, {"id": "t1", "sec": 6, "text": "보조배터리·전자담배는 선반 보관 금지", "sub": "몸에 지니거나 좌석 앞주머니에. 단자는 절연테이프나 지퍼백으로 단락 방지", "tags": {}, "status": "ok", "src": ["molit"]}, {"id": "t2", "sec": 6, "text": "보조배터리 반입 개수는 항공사마다 다름", "sub": "2026년 들어 1인 최대 2개(160Wh 이하)로 줄인 항공사가 있음 — 이용 항공사 공지 확인", "tags": {}, "status": "ok", "src": ["airpremia", "jnto"]}, {"id": "t3", "sec": 6, "text": "국적 항공사는 기내 보조배터리 사용·충전 모두 금지", "sub": "2026년 2월 기준 국적 항공사 11곳이 금지(1곳은 상반기 시행 예정). 충전은 원래 금지였고 사용까지 막은 것", "tags": {}, "status": "ok", "src": ["bat_ban", "blog_ke"]}, {"id": "t4", "sec": 6, "text": "국제선 액체류: 용기당 100ml 이하, 1L 투명 지퍼백 1개", "sub": "국내선은 액체 양 제한 없음", "tags": {}, "status": "ok", "src": ["icn_items"]}, {"id": "t5", "sec": 6, "text": "면세점 액체류는 전용 봉투에 봉인된 채로", "sub": "봉투를 뜯으면 100ml 제한을 다시 받음 — 경유편 환승 때 주의", "tags": {"region": ["해외"]}, "status": "ok", "src": ["icn_items"]}, {"id": "t6", "sec": 6, "text": "체크인 마감 시각 이후엔 수속 불가", "sub": "항공사·공항별로 다름 — 저비용항공사는 출발 50분 전 마감인 곳도 있음", "tags": {}, "status": "ok", "src": ["peach"]}, {"id": "t7", "sec": 6, "text": "위탁수하물 무게·개수는 운임 조건마다 다름", "sub": "특가 운임은 수하물 미포함인 경우 — 예약 내역에서 확인", "tags": {}, "status": "general", "src": []}, {"id": "t8", "sec": 15, "text": "체크인 전·체크아웃 후에도 짐 맡기기 가능한지 확인", "sub": "맡기면 빈손으로 바로 일정 시작", "tags": {"lodging": ["호텔·리조트", "펜션·게스트하우스"]}, "status": "general", "src": []}, {"id": "t9", "sec": 15, "text": "늦게 도착하면 숙소에 미리 연락", "sub": "연락 없이 늦으면 노쇼로 처리될 수 있음", "tags": {}, "status": "general", "src": []}, {"id": "t10", "sec": 15, "text": "무인 체크인·출입 비밀번호, 관리인 연락처 미리 확보", "sub": "관리인이 상주하지 않는 숙소가 많아 늦게 도착하면 연락이 닿지 않을 수 있음", "tags": {"lodging": ["펜션·게스트하우스"]}, "status": "general", "src": []}, {"id": "t11", "sec": 15, "text": "캠핑장은 소등·매너타임, 전기 사용 여부 확인", "sub": "캠핑장마다 규정이 다름", "tags": {"lodging": ["캠핑"]}, "status": "general", "src": []}, {"id": "t12", "sec": 15, "text": "조식 포함 여부와 조식 시간 확인", "sub": "첫 일정이 이르면 조식 시간 전에 나가야 하는 경우", "tags": {"lodging": ["호텔·리조트"]}, "status": "general", "src": []}, {"id": "t13", "sec": 15, "text": "입실하자마자 객실 상태 사진 남기기", "sub": "파손·청결 분쟁 예방", "tags": {}, "status": "general", "src": []}, {"id": "t14", "sec": 15, "text": "주차 가능 여부·유료 여부 확인", "sub": "주차 대수가 객실 수보다 적거나 인근 유료 주차장을 쓰게 하는 곳이 있음", "tags": {"transport": ["자동차"]}, "status": "general", "src": []}, {"id": "t15", "sec": 15, "text": "취사 가능 숙소인지 확인", "sub": "요리여행처럼 직접 해 먹는 일정이면 필수", "tags": {}, "status": "general", "src": []}, {"id": "t16", "sec": 26, "text": "영사콜센터 +82-2-3210-0404 (24시간)", "sub": "사건사고 상담·통역. 무료전화 앱 설치 시 무료 통화", "tags": {}, "status": "ok", "src": ["consul"]}, {"id": "t17", "sec": 26, "text": "외교부 '해외안전여행' 앱 동행 서비스", "sub": "국가별 안전정보 알림, 가족에게 위치 보내기", "tags": {}, "status": "ok", "src": ["app0404"]}, {"id": "t18", "sec": 26, "text": "자동출입국심사: 주민등록증 있는 국민은 사전등록 없이 이용", "sub": "만 7세~14세 미만은 법정대리인 동반 사전등록 필요", "tags": {}, "status": "ok", "src": ["ses"]}, {"id": "t19", "sec": 26, "text": "입국 면세 한도 1인 미화 800달러", "sub": "해외 구매 + 국내 면세점 구매 합산", "tags": {}, "status": "ok", "src": ["duty", "duty22"]}, {"id": "t20", "sec": 26, "text": "술·담배·향수는 800달러와 별도 한도", "sub": "술 2L·400달러 이내(2025년 병수 제한 폐지), 담배 200개비, 향수 100ml", "tags": {}, "status": "ok", "src": ["duty", "duty22", "liquor"]}, {"id": "t21", "sec": 26, "text": "한도 넘으면 자진신고가 유리", "sub": "미신고 적발 시 가산세. 관세청 '여행자 휴대품 예상세액 조회'로 미리 계산", "tags": {}, "status": "ok", "src": ["duty22"]}, {"id": "t22", "sec": 26, "text": "국제운전면허증: 발급일부터 1년, 제네바협약 가입국용", "sub": "현지에서 국내 면허증·여권과 함께 소지. 협약 미가입국에서는 쓸 수 없음", "tags": {"transport": ["자동차"]}, "status": "ok", "src": ["idp"]}, {"id": "t23", "sec": 26, "text": "일부 도시는 숙박세가 따로 붙음", "sub": "정액·요금 구간별·정률 등 방식이 도시마다 다름. 예약사이트에서 이미 냈는지 확인", "tags": {"lodging": ["호텔·리조트", "펜션·게스트하우스", "캠핑"]}, "status": "ok", "src": ["kyoto"]}, {"id": "t24", "sec": 26, "text": "전압·플러그 모양은 나라마다 다름 — 멀티어댑터", "sub": "규격은 출발 전 점검표로 확인", "tags": {}, "status": "general", "src": []}, {"id": "t25", "sec": 26, "text": "데이터는 로밍·eSIM·현지 유심 중 선택", "sub": "체류 기간·사용량·동행 인원으로 비교", "tags": {}, "status": "general", "src": []}, {"id": "t26", "sec": 26, "text": "여권 잔여 유효기간을 요구하는 나라가 있음", "sub": "요구 기간은 나라마다 다름 — 0404.go.kr에서 확인", "tags": {}, "status": "general", "src": []}, {"id": "t27", "sec": 5, "text": "환승 1번 줄이는 게 10분 빠른 길보다 편할 때가 많음", "sub": "짐이 있거나 일행이 많을수록", "tags": {}, "status": "general", "src": []}, {"id": "t28", "sec": 5, "text": "배차 간격부터 확인 — 놓치면 오래 기다리는 노선", "sub": "지방 버스·농어촌 노선일수록", "tags": {}, "status": "general", "src": []}, {"id": "t29", "sec": 5, "text": "오르막 동선은 위에서 아래로", "sub": "올라갈 땐 차로, 내려올 땐 걸으며 구경", "tags": {}, "status": "general", "src": []}, {"id": "t30", "sec": 5, "text": "앱 소요시간은 최소치 — 여유 시간 더하기", "sub": "어르신·아이 동행, 단체면 더 넉넉히", "tags": {}, "status": "general", "src": []}, {"id": "t31", "sec": 5, "text": "짐부터 맡기고 움직이기", "sub": "숙소(15번)나 물품보관함(20번)", "tags": {}, "status": "general", "src": []}, {"id": "t32", "sec": 5, "text": "국내 길찾기는 국내 지도 앱이 대중교통 정보가 자세함", "sub": "버스 도착 정보·빠른 하차 위치 같은 국내 교통 데이터가 연동돼 있음", "tags": {"region": ["국내"]}, "status": "general", "src": []}, {"id": "t33", "sec": 7, "text": "KTX·SRT는 2026.9.1부터 통합 운행", "sub": "코레일과 SR이 하나의 체계로 운영. 수서발 좌석도 늘어남", "tags": {"region": ["국내"]}, "status": "ok", "src": ["merge", "audit"]}, {"id": "t34", "sec": 7, "text": "예매 앱은 '코레일+' 하나 — KTX·SRT 함께 조회·예매", "sub": "2026.8.3 출시. 기존 코레일톡이 업데이트되는 방식", "tags": {"region": ["국내"]}, "status": "ok", "src": ["korailplus", "merge"]}, {"id": "t35", "sec": 7, "text": "KTX 운임 2026.9.1부터 평균 10% 인하", "sub": "통합 이후 기존 SRT 수준으로 맞춤. 구간별 운임은 앱에서 확인", "tags": {"region": ["국내"]}, "status": "ok", "src": ["ktx_fare", "merge"]}, {"id": "t36", "sec": 7, "text": "경로우대: 만 65세 이상 KTX 30% 할인", "sub": "토·일·공휴일은 할인 제외", "tags": {"region": ["국내"], "companion": ["어르신"]}, "status": "ok", "src": ["rail_dc1", "rail_dc2"]}, {"id": "t37", "sec": 7, "text": "장애인 할인: 심한 장애는 모든 열차 50%(보호자 1명 포함)", "sub": "심하지 않은 장애는 KTX·새마을 30%(토·일·공휴일 제외), 무궁화 50%", "tags": {"region": ["국내"], "companion": ["접근성 필요"]}, "status": "ok", "src": ["rail_dc1", "rail_dis"]}, {"id": "t38", "sec": 7, "text": "어린이(만 6세~13세 미만) 50%, 유아(만 6세 미만)는 좌석 없이 어른 1명당 1명 무임", "sub": "유아 좌석을 지정하거나 1명을 넘으면 75% 할인 승차권", "tags": {"region": ["국내"], "companion": ["아이"]}, "status": "ok", "src": ["rail_dc1", "rail_kid", "rail_kid2"]}, {"id": "t39", "sec": 7, "text": "명절 예매는 교통약자 사전 예매 기간이 따로 있음", "sub": "65세 이상·장애인·국가유공자·임산부 대상, 일반 예매보다 먼저", "tags": {"region": ["국내"]}, "status": "ok", "src": ["chuseok"]}, {"id": "t40", "sec": 7, "text": "큰 짐은 객차 끝 짐칸 — 짐 가까운 좌석이 편함", "sub": "좌석 위 선반은 작은 가방용이라 캐리어는 출입구 쪽 짐칸에 둠", "tags": {}, "status": "general", "src": []}, {"id": "t41", "sec": 7, "text": "풍경 좋은 쪽 창가는 노선마다 다름", "sub": "바다·강 구간이 진행 방향 어느 쪽인지 미리 확인 (사진은 18번)", "tags": {}, "status": "general", "src": []}, {"id": "t42", "sec": 8, "text": "고속·시외·공항버스를 한 앱에서 예매 가능", "sub": "예: 티머니GO — 모바일 승차권 QR로 탑승", "tags": {"region": ["국내"]}, "status": "ok", "src": ["tmoney"]}, {"id": "t43", "sec": 8, "text": "고속버스·시외버스 전용 예매처도 따로 있음", "sub": "고속버스는 '고속버스 티머니'(고속버스운송사업조합 공식 앱), 시외버스는 '버스타고'(시외버스 통합 예매)", "tags": {"region": ["국내"]}, "status": "ok", "src": ["app_kobus", "app_bustago", "busguide"]}, {"id": "t44", "sec": 8, "text": "좌석 등급(프리미엄·우등·일반)에 따라 요금·좌석 폭이 다름", "sub": "장거리일수록 등급 차이가 체감됨", "tags": {"region": ["국내"]}, "status": "general", "src": []}, {"id": "t45", "sec": 8, "text": "일정 바뀌면 바로 취소 — 출발 가까울수록 수수료가 커짐", "sub": "여러 시간대를 중복 예매했다면 특히", "tags": {}, "status": "general", "src": []}, {"id": "t46", "sec": 8, "text": "휴게소 정차는 짧음 — 버스 번호·출발 시각 사진 찍어 두기", "sub": "같은 회사 버스가 여러 대 나란히 서 있어 헷갈리기 쉬움", "tags": {}, "status": "general", "src": []}, {"id": "t47", "sec": 8, "text": "짐은 하부 짐칸, 귀중품·약은 몸에", "sub": "하부 짐칸은 운행 중에 열 수 없음", "tags": {}, "status": "general", "src": []}, {"id": "t48", "sec": 9, "text": "환승할인 인정 시간·횟수는 지역마다 다름", "sub": "보통 하차 후 30분 안팎, 심야엔 늘어나는 곳도. 같은 노선끼리는 환승 불가 — 도착 지역 규정 확인", "tags": {"region": ["국내"]}, "status": "ok", "src": ["seoul_tr"]}, {"id": "t49", "sec": 9, "text": "내릴 때도 카드 태그 — 안 찍으면 환승이 끊기고 추가 요금", "sub": "하차 태그를 해야 다음 승차 때 환승으로 인정됨", "tags": {"region": ["국내"]}, "status": "ok", "src": ["seoul_tr"]}, {"id": "t50", "sec": 9, "text": "환승할인은 1인 1카드", "sub": "일행 요금을 카드 한 장으로 내면 환승 혜택이 끊김", "tags": {"region": ["국내"]}, "status": "ok", "src": ["seoul_tr"]}, {"id": "t51", "sec": 9, "text": "교통비 환급 제도(K-패스·모두의 카드)는 지역 내 대중교통 대상", "sub": "KTX·SRT·새마을·무궁화, 고속·시외버스는 제외(2026.1 기준, 확대 검토 중). 짧은 여행보다 정기 이용자용", "tags": {"region": ["국내"]}, "status": "ok", "src": ["kpass2", "kpass"]}, {"id": "t52", "sec": 9, "text": "교통카드 하나 미리 충전해 두기", "sub": "현금을 받지 않는 버스를 운영하는 지역이 있음", "tags": {}, "status": "general", "src": []}, {"id": "t53", "sec": 10, "text": "외곽 관광지는 내리기 전에 돌아올 방법부터", "sub": "기사님 연락처를 받거나 그 지역 호출 가능 여부 확인", "tags": {}, "status": "general", "src": []}, {"id": "t54", "sec": 10, "text": "3~4명이면 택시와 대중교통 비용 차이가 작은 구간이 있음", "sub": "직접 계산해 보고 말하기", "tags": {}, "status": "general", "src": []}, {"id": "t55", "sec": 10, "text": "큰 짐·휠체어는 대형·승합 호출 옵션 확인", "sub": "이동 약자 이동수단은 24번", "tags": {}, "status": "general", "src": []}, {"id": "t56", "sec": 10, "text": "영수증이나 차량번호 남기기 — 분실물 찾을 때 필요", "sub": "분실 대처는 23번", "tags": {}, "status": "general", "src": []}, {"id": "t57", "sec": 11, "text": "렌터카 인수 때 차량 외관 사진·영상 남기기", "sub": "반납 때 흠집 분쟁 예방", "tags": {}, "status": "general", "src": []}, {"id": "t58", "sec": 11, "text": "보험(자차 면책) 범위와 본인 부담금 확인", "sub": "자차 보험을 들어도 면책금·휴차 보상료가 따로 붙는 경우가 많음", "tags": {}, "status": "general", "src": []}, {"id": "t59", "sec": 11, "text": "고속도로 통행료: 장애인 50%, 국가유공자(1~5급) 100% 감면", "sub": "2026.7.28부터 1년 이상 임차·대여 차량도 포함. 사전 신청 필요", "tags": {"region": ["국내"], "companion": ["접근성 필요"]}, "status": "ok", "src": ["toll"]}, {"id": "t60", "sec": 11, "text": "다자녀 가구 주말·공휴일 통행료 할인", "sub": "미성년 자녀 3명 이상 20%, 2명 10%. 하이패스 사전 등록, 2029.8.21까지 한시", "tags": {"region": ["국내"], "companion": ["아이"]}, "status": "ok", "src": ["toll"]}, {"id": "t61", "sec": 11, "text": "장거리는 쉬어 갈 휴게소·쉼터를 미리 정하기", "sub": "졸음운전 예방 — 2시간마다 한 번 쉬는 것이 흔히 권장됨", "tags": {}, "status": "general", "src": []}, {"id": "t62", "sec": 12, "text": "여객선은 신분증 필수 — 없으면 승선 불가", "sub": "동행 전원 지참", "tags": {"region": ["국내"]}, "status": "ok", "src": ["ship_id", "ship_mof"]}, {"id": "t63", "sec": 12, "text": "모바일 신분증은 인정, 사진·캡처본은 불인정", "sub": "정부24·PASS의 모바일 확인서비스 등", "tags": {"region": ["국내"]}, "status": "ok", "src": ["ship_id", "ship_mof"]}, {"id": "t64", "sec": 12, "text": "신분증 없는 미성년자는 보호자·인솔교사 확인으로 승선", "sub": "인솔자가 명단·연락처를 준비해 두면 확인이 빠름", "tags": {"region": ["국내"], "companion": ["아이"]}, "status": "ok", "src": ["ship_id", "ship_mof"]}, {"id": "t65", "sec": 12, "text": "멀미가 걱정되면 배 가운데·아래층 좌석", "sub": "흔들림이 상대적으로 적은 자리", "tags": {}, "status": "general", "src": []}, {"id": "t66", "sec": 12, "text": "갑판 촬영은 출항 직후·입항 직전", "sub": "운항 중엔 바람·파도에 주의", "tags": {}, "status": "general", "src": []}, {"id": "t67", "sec": 13, "text": "케이블카는 타는 시간보다 줄 서는 시간이 길 수 있음", "sub": "개장 직후나 마감 전이 한산", "tags": {}, "status": "general", "src": []}, {"id": "t68", "sec": 13, "text": "순환버스는 배차 간격과 마지막 차 시각 확인", "sub": "배차가 길면 오히려 시간 손해", "tags": {}, "status": "general", "src": []}, {"id": "t69", "sec": 13, "text": "왕복 대신 편도 + 걸어 내려오기 조합", "sub": "이동 공통(5번)의 '위에서 아래로'와 같은 원리", "tags": {}, "status": "general", "src": []}, {"id": "t70", "sec": 13, "text": "바람 부는 날은 운휴에 대비한 대안 동선", "sub": "케이블카·출렁다리 등은 일정 풍속을 넘으면 운행을 멈춤", "tags": {}, "status": "general", "src": []}, {"id": "t71", "sec": 14, "text": "전동킥보드는 면허 필요(원동기장치자전거 이상, 만 16세 이상), 안전모 의무", "sub": "2025.12 헌법재판소 합헌 결정으로 현행 유지", "tags": {"region": ["국내"]}, "status": "ok", "src": ["pm_seoul", "pm_court"]}, {"id": "t72", "sec": 14, "text": "페달 보조형(PAS) 전기자전거는 면허 없이 만 13세 이상", "sub": "인도 주행 불가", "tags": {"region": ["국내"]}, "status": "ok", "src": ["pm_seoul"]}, {"id": "t73", "sec": 14, "text": "도보 코스엔 길들인 신발", "sub": "새 신발은 물집의 원인", "tags": {}, "status": "general", "src": []}, {"id": "t74", "sec": 14, "text": "공공자전거는 반납 대여소 위치까지 동선에 넣기", "sub": "대여소가 아닌 곳에 두면 반납 처리가 안 되거나 추가 요금이 붙음", "tags": {}, "status": "general", "src": []}, {"id": "t75", "sec": 1, "text": "궁궐·유적 야간관람은 대부분 온라인 사전 예매", "sub": "회차마다 예매처·오픈일을 따로 공지", "tags": {"region": ["국내"], "place": ["궁궐·유적지"]}, "status": "ok", "src": ["palace_night"]}, {"id": "t76", "sec": 1, "text": "국립공원 대피소·야영장은 예약제", "sub": "공단 예약시스템 외 2026.6.17부터 카카오·올원뱅크에서도 예약. 노쇼 제한 적용", "tags": {"region": ["국내"], "place": ["산"]}, "status": "ok", "src": ["knps"]}, {"id": "t77", "sec": 1, "text": "인기 체험·식당은 예약 오픈 알림 설정", "sub": "인기 회차는 열리자마자 마감되는 경우가 많음", "tags": {}, "status": "general", "src": []}, {"id": "t78", "sec": 1, "text": "단체는 별도 단체 예약 창구가 있는지 확인", "sub": "개인 예약과 조건이 다른 곳이 있음", "tags": {}, "status": "general", "src": []}, {"id": "t79", "sec": 1, "text": "예약 확인 문자·QR은 캡처해 두기", "sub": "현장에서 통신이 약할 때 대비", "tags": {}, "status": "general", "src": []}, {"id": "t80", "sec": 2, "text": "한국관광공사 '대한민국 구석구석' — 지역 여행정보·행사 일정", "sub": "지역 축제·행사 일정과 무장애 여행 정보까지 한곳에 모여 있음", "tags": {"region": ["국내"]}, "status": "ok", "src": ["palace_night"]}, {"id": "t81", "sec": 2, "text": "지도 앱 영업시간은 틀릴 수 있음 — 전화나 공식 공지로 확인", "sub": "임시 휴무·영업시간 변경이 지도 앱에 늦게 반영됨", "tags": {}, "status": "general", "src": []}, {"id": "t82", "sec": 2, "text": "후기는 작성 날짜부터 보기", "sub": "메뉴·가격·운영시간이 바뀌었을 수 있음", "tags": {}, "status": "general", "src": []}, {"id": "t83", "sec": 2, "text": "축제는 '올해' 공식 공지로 일정 확인", "sub": "작년 글을 보고 가는 실수가 많음", "tags": {"place": ["축제"]}, "status": "general", "src": []}, {"id": "t84", "sec": 2, "text": "주차장 만차 여부는 도착 전에 확인", "sub": "인기 관광지는 주차장 진입 대기만 수십 분 걸리기도 함", "tags": {"transport": ["자동차"]}, "status": "general", "src": []}, {"id": "t85", "sec": 3, "text": "겹쳐 입기 — 벗고 입기 쉬운 얇은 겉옷", "sub": "실내외 온도 차와 일교차에 맞춰 조절하기 쉬움", "tags": {}, "status": "general", "src": []}, {"id": "t86", "sec": 3, "text": "산 위는 아래보다 춥고 바람이 셈 — 여름에도 바람막이", "sub": "고도가 100m 높아질 때마다 기온이 약 0.6℃씩 떨어짐", "tags": {"place": ["산"]}, "status": "general", "src": []}, {"id": "t87", "sec": 3, "text": "바닷가·섬은 바람 때문에 체감온도가 낮음", "sub": "바람이 강할수록 체감온도는 실제 기온보다 낮아짐", "tags": {"place": ["해변", "섬"]}, "status": "general", "src": []}, {"id": "t88", "sec": 3, "text": "비 오는 날은 우산보다 우비 — 손이 자유로움", "sub": "방수 신발, 젖은 옷 갈아입을 여벌", "tags": {"weather": ["비 오는 날"]}, "status": "general", "src": []}, {"id": "t89", "sec": 3, "text": "더운 날은 모자·물 필수 — 그늘 적은 유적지 주의", "sub": "유적지는 넓은 마당이 많아 햇볕에 오래 노출됨", "tags": {"weather": ["더운 날"]}, "status": "general", "src": []}, {"id": "t90", "sec": 3, "text": "추운 날은 장갑·손난로, 배터리가 빨리 닳음", "sub": "휴대전화·카메라 여분 배터리는 몸 가까이", "tags": {"weather": ["추운 날"]}, "status": "general", "src": []}, {"id": "t91", "sec": 3, "text": "사찰은 노출 적은 단정한 복장, 법당엔 양말", "sub": "법당은 신을 벗고 들어가는 공간", "tags": {"place": ["사찰"]}, "status": "ok", "src": ["temple"]}, {"id": "t92", "sec": 4, "text": "'문화가 있는 날'은 2026.4.1부터 매주 수요일", "sub": "박물관·미술관 혜택, 야간 개방 등. 영화 할인은 월 2회(둘째·마지막 수요일)", "tags": {"region": ["국내"]}, "status": "ok", "src": ["culture_wed"]}, {"id": "t93", "sec": 4, "text": "궁궐·종묘·조선왕릉 무료 대상", "sub": "만 24세 이하·65세 이상 내국인, 한복 착용자, 등록장애인(심한 장애는 보호자 1명) 등. 신분증 지참", "tags": {"region": ["국내"], "place": ["궁궐·유적지"]}, "status": "ok", "src": ["palace_free"]}, {"id": "t94", "sec": 4, "text": "궁·능이 있는 시·군·구 주민은 관람료 50% 할인", "sub": "주민등록 증빙 필요", "tags": {"region": ["국내"], "place": ["궁궐·유적지"]}, "status": "ok", "src": ["palace_free"]}, {"id": "t95", "sec": 4, "text": "국립 박물관 상설전시는 지금은 무료지만 유료 전환이 추진 중", "sub": "2027년 예산안에 대표 국립박물관 유료화 방침(성인 5,000~10,000원 전망, 시행 월 협의 중). 고궁·왕릉 입장료도 인상 방침", "tags": {"region": ["국내"], "place": ["박물관"]}, "status": "ok", "src": ["museum_free", "museum_fee"]}, {"id": "t96", "sec": 4, "text": "통합권은 다 돌 때만 이득 — 갈 곳 수부터 계산", "sub": "여러 곳을 묶은 가격이라 두세 곳만 가면 개별 구매가 더 쌀 수 있음", "tags": {}, "status": "general", "src": []}, {"id": "t97", "sec": 4, "text": "전통시장은 소액 현금 준비", "sub": "현금·계좌이체를 선호하는 가게가 있음", "tags": {"place": ["시장"]}, "status": "general", "src": []}, {"id": "t98", "sec": 4, "text": "지역화폐·상품권은 사용처가 정해져 있음", "sub": "남은 잔액을 어디에 쓸지 생각하고 충전", "tags": {"region": ["국내"]}, "status": "general", "src": []}, {"id": "t99", "sec": 16, "text": "궁궐은 휴궁 요일이 궁마다 다름", "sub": "축제 기간엔 휴궁 없이 여는 경우도. 입장 마감은 관람 종료 1시간 전인 곳이 많음", "tags": {"region": ["국내"], "place": ["궁궐·유적지"]}, "status": "ok", "src": ["gbg", "palace_night"]}, {"id": "t100", "sec": 16, "text": "박물관은 휴관일·야간 개장 요일이 곳마다 다름", "sub": "명절 당일 휴관, 월요일 휴관이 흔함 — 방문 전 확인", "tags": {"place": ["박물관"]}, "status": "general", "src": []}, {"id": "t101", "sec": 16, "text": "개화·단풍 시기는 해마다 다름 — 올해 예보 확인", "sub": "그해 기온에 따라 앞당겨지거나 늦어짐", "tags": {}, "status": "general", "src": []}, {"id": "t102", "sec": 16, "text": "성수기 주말은 오전 일찍 시작", "sub": "늦게 출발할수록 주차·입장 대기가 길어짐", "tags": {"weather": ["성수기"]}, "status": "general", "src": []}, {"id": "t103", "sec": 16, "text": "오래 줄 서는 곳은 하루 한 곳만", "sub": "줄서기로 하루가 끝나지 않게", "tags": {}, "status": "general", "src": []}, {"id": "t104", "sec": 17, "text": "문화관광해설사 해설은 무료", "sub": "통합예약 사이트·지자체 사이트·전화·현장 접수", "tags": {"region": ["국내"]}, "status": "ok", "src": ["kctg"]}, {"id": "t105", "sec": 17, "text": "정시 해설은 시작 10분 전 출발 위치에 도착", "sub": "출발 위치를 찾다가 시작을 놓치는 경우가 많음", "tags": {}, "status": "general", "src": []}, {"id": "t106", "sec": 17, "text": "큰 박물관은 꼭 볼 유물 몇 개만 정하고 들어가기", "sub": "다 보려다 지치면 정작 핵심 유물을 대충 보게 됨", "tags": {"place": ["박물관"]}, "status": "general", "src": []}, {"id": "t107", "sec": 17, "text": "체험은 옷이 더러워질 수 있음 — 앞치마 제공 여부 확인", "sub": "흙·염료·음식 체험은 옷에 묻기 쉬움", "tags": {}, "status": "general", "src": []}, {"id": "t108", "sec": 18, "text": "해를 등지면(순광) 색이 선명, 마주 보면(역광) 실루엣·분위기", "sub": "순광은 빛이 피사체 정면에 닿고, 역광은 윤곽만 밝아지기 때문", "tags": {}, "status": "general", "src": []}, {"id": "t109", "sec": 18, "text": "해 뜬 직후·해 지기 전 빛이 부드러움", "sub": "인물 사진에 유리", "tags": {}, "status": "general", "src": []}, {"id": "t110", "sec": 18, "text": "사람은 화면 가장자리 앞쪽, 랜드마크는 전체가 들어가게", "sub": "사람을 앞에 두면 크기 대비로 랜드마크의 규모가 드러남", "tags": {}, "status": "general", "src": []}, {"id": "t111", "sec": 18, "text": "인파 없는 사진은 개장 직후나 마감 무렵", "sub": "단체 방문이 시작되기 전이나 끝난 뒤라 한산함", "tags": {}, "status": "general", "src": []}, {"id": "t112", "sec": 18, "text": "도심 주요 시설 주변은 드론 비행금지구역", "sub": "사전 승인 없이 날리면 과태료 — 촬영 전 비행 가능 지역 확인", "tags": {"region": ["국내"]}, "status": "ok", "src": ["drone"]}, {"id": "t113", "sec": 18, "text": "실내 전시는 플래시 금지인 곳이 많음", "sub": "강한 빛이 유물·그림의 색을 바래게 할 수 있음", "tags": {"place": ["박물관"]}, "status": "general", "src": []}, {"id": "t114", "sec": 18, "text": "비 오는 날은 물웅덩이 반영 사진의 기회", "sub": "젖은 바닥이 거울처럼 건물과 조명을 비춤", "tags": {"weather": ["비 오는 날"]}, "status": "general", "src": []}, {"id": "t115", "sec": 18, "text": "야경은 해 진 직후 하늘이 남색일 때", "sub": "완전히 깜깜해지기 전", "tags": {"place": ["야경 명소"]}, "status": "general", "src": []}, {"id": "t116", "sec": 19, "text": "점심 피크를 피해 11시대나 13시 반 이후", "sub": "직장인·관광객 점심이 12시~1시에 몰림", "tags": {}, "status": "general", "src": []}, {"id": "t117", "sec": 19, "text": "브레이크타임 직전 입장은 주문이 마감될 수 있음", "sub": "라스트오더가 브레이크타임 시작보다 먼저 끝남", "tags": {}, "status": "general", "src": []}, {"id": "t118", "sec": 19, "text": "시장은 한 집에서 다 먹기보다 여러 집 조금씩", "sub": "한 집에서 배를 채우면 다른 명물을 못 먹음", "tags": {"place": ["시장"]}, "status": "general", "src": []}, {"id": "t119", "sec": 19, "text": "관광지 바로 앞보다 한 블록 뒤 골목", "sub": "관광지 바로 앞은 임대료가 높아 가격이 비싼 편인 경우가 많음", "tags": {}, "status": "general", "src": []}, {"id": "t120", "sec": 19, "text": "일행이 많으면 미리 인원을 알려 자리 확보", "sub": "4인석 위주 식당은 여럿이 한꺼번에 앉기 어려움", "tags": {}, "status": "general", "src": []}, {"id": "t121", "sec": 20, "text": "관광지 입구 화장실을 들르고 출발", "sub": "안쪽엔 화장실이 없거나 먼 곳이 있음", "tags": {}, "status": "general", "src": []}, {"id": "t122", "sec": 20, "text": "역 물품보관함은 큰 칸부터 참 — 일찍 맡기기", "sub": "큰 칸은 수가 적어 오전에 먼저 참", "tags": {}, "status": "general", "src": []}, {"id": "t123", "sec": 20, "text": "휴지·물티슈 챙기기", "sub": "시장·산 화장실은 휴지가 없거나 떨어진 경우가 있음", "tags": {"place": ["시장", "산"]}, "status": "general", "src": []}, {"id": "t124", "sec": 20, "text": "축제장은 화장실 줄이 김 — 미리 다녀오기", "sub": "임시 화장실 수가 인파에 비해 적음", "tags": {"place": ["축제"]}, "status": "general", "src": []}, {"id": "t125", "sec": 21, "text": "법당 가운데 문(어간문)은 큰스님이 다니는 문 — 옆문으로 출입", "sub": "옆문이 없으면 가운데를 피해 양쪽 끝 문", "tags": {"place": ["사찰"]}, "status": "ok", "src": ["temple"]}, {"id": "t126", "sec": 21, "text": "스님께는 합장 반배 — 식사·수행 중엔 가볍게 목례만", "sub": "수행 중에 말을 걸면 방해가 됨", "tags": {"place": ["사찰"]}, "status": "ok", "src": ["temple"]}, {"id": "t127", "sec": 21, "text": "예불·기도 중인 사람은 촬영 자제", "sub": "기도는 개인의 신앙 행위라 찍히는 것을 원치 않는 사람이 많음", "tags": {"place": ["사찰"]}, "status": "general", "src": []}, {"id": "t128", "sec": 21, "text": "주민이 사는 관광지(벽화마을·한옥마을)는 조용히, 집 안·주민 촬영 자제", "sub": "실제 생활 공간이라 소음·촬영 민원이 많음", "tags": {}, "status": "general", "src": []}, {"id": "t129", "sec": 21, "text": "문화유산 담장·기단에 올라가 찍지 않기", "sub": "훼손 위험이 있어 관람 규칙으로 금지한 곳이 많음", "tags": {"place": ["궁궐·유적지"]}, "status": "general", "src": []}, {"id": "t130", "sec": 22, "text": "열사병 의심(체온 40℃ 이상, 의식 이상)은 즉시 119", "sub": "시원한 곳으로 옮기고 목·겨드랑이를 식히기. 의식이 없으면 물을 먹이지 않기", "tags": {"weather": ["더운 날"]}, "status": "ok", "src": ["heat"]}, {"id": "t131", "sec": 22, "text": "열탈진은 시원한 곳에서 다리를 높이고 휴식", "sub": "의식이 있고 구토가 없으면 물·전해질 음료. 1시간 지나도 그대로면 병원", "tags": {"weather": ["더운 날"]}, "status": "ok", "src": ["heat"]}, {"id": "t132", "sec": 22, "text": "물은 목마르기 전에 조금씩", "sub": "목이 마르다고 느낄 때는 이미 수분이 부족한 상태", "tags": {"weather": ["더운 날"]}, "status": "general", "src": []}, {"id": "t133", "sec": 22, "text": "산은 해 지기 전에 하산 완료", "sub": "내려오는 데도 시간이 걸림 — 하산 시각을 먼저 정하기", "tags": {"place": ["산"]}, "status": "general", "src": []}, {"id": "t134", "sec": 22, "text": "물놀이는 안전요원이 있는 지정 구역에서, 구명조끼", "sub": "안전요원이 없는 곳은 사고가 나도 바로 구조받기 어려움", "tags": {"place": ["해변", "섬"]}, "status": "general", "src": []}, {"id": "t135", "sec": 22, "text": "비 온 뒤 바위·계단·나무데크는 미끄러움", "sub": "물기에 이끼·나무 표면이 더 미끄러워짐", "tags": {"weather": ["비 오는 날"]}, "status": "general", "src": []}, {"id": "t136", "sec": 22, "text": "손끝·귀 감각이 둔해지면 바로 실내로", "sub": "감각이 둔해지는 것은 동상의 초기 신호일 수 있음", "tags": {"weather": ["추운 날"]}, "status": "general", "src": []}, {"id": "t137", "sec": 22, "text": "상비약 챙기기 — 소화제·밴드·진통제·멀미약", "sub": "관광지·섬은 약국이 멀거나 일찍 닫음", "tags": {}, "status": "general", "src": []}, {"id": "t138", "sec": 23, "text": "분실물은 LOST112(경찰청 유실물 통합포털)에서 습득물부터 검색", "sub": "없으면 분실 신고. 새로 사기 전에 확인", "tags": {"region": ["국내"]}, "status": "ok", "src": ["lost"]}, {"id": "t139", "sec": 23, "text": "대중교통 분실물은 운영기관이 보관 후 경찰로 넘김", "sub": "탄 노선·차량번호·시각을 기억해 두면 찾기 쉬움", "tags": {"region": ["국내"]}, "status": "ok", "src": ["lost"]}, {"id": "t140", "sec": 23, "text": "휴일에 문 연 병원·약국은 응급의료포털 E-Gen(앱·웹)", "sub": "전화로는 129(보건복지상담센터)·120(시·도 콜센터)", "tags": {"region": ["국내"]}, "status": "ok", "src": ["egen"]}, {"id": "t141", "sec": 23, "text": "호흡곤란·갑작스러운 팔다리 저림은 바로 119", "sub": "구급대 오기 전 전화로 응급처치 안내도 받음", "tags": {"region": ["국내"]}, "status": "ok", "src": ["egen"]}, {"id": "t142", "sec": 23, "text": "12세 이하 아이는 '아이안심톡' 24시간 온라인 상담", "sub": "응급 전문의 상담 후 필요하면 달빛어린이병원", "tags": {"region": ["국내"], "companion": ["아이"]}, "status": "ok", "src": ["egen"]}, {"id": "t143", "sec": 23, "text": "휴대전화 배터리는 비상 연락용으로 남겨 두기", "sub": "보조배터리 휴대", "tags": {}, "status": "general", "src": []}, {"id": "t144", "sec": 23, "text": "날씨가 급변하면 실내 대안 동선으로", "sub": "우천여행 시리즈 자료와 연결", "tags": {"weather": ["비 오는 날"]}, "status": "general", "src": []}, {"id": "t145", "sec": 24, "text": "철도 휠체어석 승객은 승하차 도우미 신청 가능", "sub": "휠체어석 승차권 구매 후 앱에서 출발 하루 전까지 (2021년 도입 당시 코레일톡 기준, 현재 앱은 코레일+)", "tags": {"region": ["국내"], "transport": ["철도"]}, "status": "ok", "src": ["wheel_rail", "korailplus"]}, {"id": "t146", "sec": 24, "text": "휠체어 탑승 가능한 고속·시외버스는 일부 노선뿐", "sub": "2019.10 시범운행 시작(4개 노선, 버스 1대에 휠체어 2대). 당시 예매는 고속버스 예매시스템에서 출발 3일 전까지 — 현재 노선·방식은 운수사에 확인", "tags": {"region": ["국내"], "transport": ["고속·시외버스"]}, "status": "check", "src": ["wheel_bus2"]}, {"id": "t147", "sec": 24, "text": "장애인 콜택시(교통약자 이동지원)는 지자체마다 운영 방식이 다름", "sub": "다른 시·군으로 가는 이동이 되는지, 예약 방식 확인", "tags": {"region": ["국내"]}, "status": "general", "src": []}, {"id": "t148", "sec": 24, "text": "무장애 여행지 정보는 한국관광공사 '대한민국 구석구석'에서", "sub": "무장애 산책로, 휠체어로 탈 수 있는 체험시설 등이 소개됨", "tags": {"region": ["국내"]}, "status": "ok", "src": ["barrierfree"]}, {"id": "t149", "sec": 24, "text": "큰 시설은 휠체어 대여를 하는 곳이 있음 — 수량이 적으니 사전 확인", "sub": "먼저 온 사람이 빌려 가면 남는 게 없음", "tags": {}, "status": "general", "src": []}, {"id": "t150", "sec": 24, "text": "'장애인 화장실 있음'과 실제 휠체어 회전 가능 여부는 다를 수 있음", "sub": "사진을 요청하거나 직접 확인", "tags": {}, "status": "general", "src": []}, {"id": "t151", "sec": 24, "text": "잔디·자갈·모래길은 평지라도 휠체어 이동이 어려움", "sub": "바퀴가 빠지거나 덜컹거려 힘이 많이 들고 위험함", "tags": {}, "status": "general", "src": []}, {"id": "t152", "sec": 24, "text": "단체는 엘리베이터 대기 시간을 일정에 넣기", "sub": "한 번에 탈 수 있는 인원이 적음", "tags": {}, "status": "general", "src": []}, {"id": "t153", "sec": 25, "text": "아이 낮잠 시간을 이동 시간에 맞추기", "sub": "이동 중에 재우면 도착해서 아이 컨디션이 좋음", "tags": {"companion": ["아이"]}, "status": "general", "src": []}, {"id": "t154", "sec": 25, "text": "유모차는 계단·자갈길에서 어려움 — 아기띠 함께", "sub": "계단·자갈길에서는 유모차를 들고 다녀야 함", "tags": {"companion": ["아이"]}, "status": "general", "src": []}, {"id": "t155", "sec": 25, "text": "아이 몸에 보호자 연락처 — 미아 대비", "sub": "길을 잃은 아이는 보호자 연락처를 말하지 못하는 경우가 많음", "tags": {"companion": ["아이"]}, "status": "general", "src": []}, {"id": "t156", "sec": 25, "text": "어르신은 자주 앉아 쉴 곳을 동선에 넣기", "sub": "오래 서 있거나 걷는 것이 쉽게 피로로 이어짐", "tags": {"companion": ["어르신"]}, "status": "general", "src": []}, {"id": "t157", "sec": 25, "text": "경로 할인은 신분증 지참", "sub": "철도는 7번, 궁궐·박물관은 4번", "tags": {"companion": ["어르신"]}, "status": "general", "src": []}, {"id": "t158", "sec": 25, "text": "국립공원 반려견은 지정 구간·시설만 출입 가능", "sub": "지정 구간은 국립공원공단 공지로 확인. 1인 1마리, 등록·광견병 접종 증빙, 맹견 불가", "tags": {"region": ["국내"], "companion": ["반려동물"], "place": ["산"]}, "status": "ok", "src": ["pet_park"]}, {"id": "t159", "sec": 25, "text": "열차 반려동물: 이동장 포함 10kg 이하, 이동장 세 변 합 100cm 이하", "sub": "개·고양이·새. 이동장 밖으로 꺼내지 않기, 예방접종 확인서 요구 가능. 2025.12 기준", "tags": {"region": ["국내"], "companion": ["반려동물"], "transport": ["철도"]}, "status": "ok", "src": ["pet_trans2", "pet_trans"]}, {"id": "t160", "sec": 25, "text": "고속버스 반려동물: 케이지 포함 10kg 이하, 케이지 밖으로 꺼내지 않기", "sub": "옆좌석을 성인 요금으로 사서 둘 수 있음. 2025.12 기준, 운송사마다 다를 수 있음", "tags": {"region": ["국내"], "companion": ["반려동물"], "transport": ["고속·시외버스"]}, "status": "ok", "src": ["pet_trans2", "pet_trans"]}, {"id": "t161", "sec": 25, "text": "'반려동물 동반 가능'의 범위는 곳마다 다름", "sub": "실내 가능인지 야외·테라스만인지 확인", "tags": {"companion": ["반려동물"]}, "status": "general", "src": []}, {"id": "t162", "sec": 16, "text": "테마파크는 개장 전 도착, 대기 긴 기구부터", "sub": "오전엔 줄이 짧고 시간이 갈수록 길어짐", "tags": {"place": ["테마파크"]}, "status": "general", "src": []}, {"id": "t163", "sec": 4, "text": "대기 줄을 줄이는 유료 패스가 있는 곳이 많음", "sub": "가격과 하루 이용 횟수 제한을 보고 판단", "tags": {"place": ["테마파크"]}, "status": "general", "src": []}, {"id": "t164", "sec": 25, "text": "놀이기구는 키·나이 제한이 있음", "sub": "아이가 탈 수 있는 기구부터 확인하고 동선 짜기", "tags": {"place": ["테마파크"], "companion": ["아이"]}, "status": "general", "src": []}, {"id": "t165", "sec": 23, "text": "비·강풍이면 야외 기구가 멈춤 — 실내 시설로 전환", "sub": "안전 기준에 따라 운행을 멈추는 기구가 많음", "tags": {"place": ["테마파크"]}, "status": "general", "src": []}, {"id": "t166", "sec": 17, "text": "퍼레이드·공연 시간을 먼저 확인하고 동선 짜기", "sub": "공연 시간엔 기구 대기가 줄어드는 경우도 있음", "tags": {"place": ["테마파크"]}, "status": "general", "src": []}, {"id": "t167", "sec": 20, "text": "재입장 가능 여부 확인", "sub": "도장·팔찌 등 방식이 곳마다 다름", "tags": {"place": ["테마파크"]}, "status": "general", "src": []}, {"id": "t168", "sec": 18, "text": "야경은 삼각대가 있으면 흔들림이 줄어듦", "sub": "혼잡한 곳은 삼각대 금지인 경우가 많음 — 난간·벽에 기대 찍기", "tags": {"place": ["야경 명소"]}, "status": "general", "src": []}, {"id": "t169", "sec": 16, "text": "조명 점등·소등 시간 확인", "sub": "늦은 밤엔 조명을 끄는 곳이 있음", "tags": {"place": ["야경 명소"]}, "status": "general", "src": []}, {"id": "t170", "sec": 5, "text": "야경 일정은 돌아갈 막차·택시부터 확인", "sub": "관광지 대중교통은 밤에 일찍 끊기는 곳이 많음", "tags": {"place": ["야경 명소"]}, "status": "general", "src": []}, {"id": "t171", "sec": 3, "text": "밤엔 기온이 떨어짐 — 겉옷 하나", "sub": "강·바다·언덕 위 야경 명소는 바람이 더 셈", "tags": {"place": ["야경 명소"]}, "status": "general", "src": []}, {"id": "t172", "sec": 22, "text": "어두운 계단·산책로는 휴대전화 손전등", "sub": "야간엔 발밑 단차가 잘 안 보임", "tags": {"place": ["야경 명소"]}, "status": "general", "src": []}, {"id": "t173", "sec": 15, "text": "숙박 취소 위약금은 시기·요일·취소 시점에 따라 다름", "sub": "비수기 주중은 이틀 전 취소면 계약금 전액 환급. 숙소 약관이 있으면 약관, 분쟁 시 소비자분쟁해결기준", "tags": {}, "status": "ok", "src": ["stay_refund"]}, {"id": "t174", "sec": 15, "text": "성수기 숙박은 10일 전까지 취소해야 계약금 전액 환급", "sub": "약관에 없으면 성수기는 여름 7.15~8.24, 겨울 12.20~2.20. 성수기 주말 당일 취소는 총요금의 90% 공제", "tags": {"weather": ["성수기"]}, "status": "ok", "src": ["stay_refund"]}, {"id": "t175", "sec": 4, "text": "성수기엔 날짜를 하루만 옮겨도 가격 차이가 큼", "sub": "금·토 숙박은 '주말' 요금", "tags": {"weather": ["성수기"]}, "status": "general", "src": []}, {"id": "t176", "sec": 5, "text": "성수기엔 주차장보다 대중교통·셔틀", "sub": "주차장 진입 대기로 일정이 밀림", "tags": {"weather": ["성수기"]}, "status": "general", "src": []}, {"id": "t177", "sec": 19, "text": "성수기엔 인기 식당 대신 예약 가능한 곳을 하나 확보", "sub": "인기 식당은 대기가 길어 일정 전체가 밀림", "tags": {"weather": ["성수기"]}, "status": "general", "src": []}, {"id": "t178", "sec": 22, "text": "이안류에 휩쓸리면 해안과 평행하게 헤엄쳐 벗어나기", "sub": "해안 쪽으로 곧장 헤엄치면 물살을 거슬러 지침. 이안류 예측정보가 '위험'이면 입수 자제", "tags": {"place": ["해변"]}, "status": "ok", "src": ["rip"]}, {"id": "t179", "sec": 22, "text": "해파리에 쏘이면 바닷물로 씻기 — 수돗물·식초는 금지", "sub": "민물이 남은 독침을 자극함. 남은 촉수는 핀셋·플라스틱 카드로 떼고, 통증이 심하면 119", "tags": {"place": ["해변", "섬"]}, "status": "ok", "src": ["jelly"]}, {"id": "t180", "sec": 22, "text": "갯벌·바닷길은 물때 확인", "sub": "밀물은 생각보다 빨리 들어옴", "tags": {"place": ["해변", "섬"]}, "status": "general", "src": []}, {"id": "t181", "sec": 3, "text": "해변은 자외선이 모래·물에 반사돼 더 강함", "sub": "선크림·모자·선글라스", "tags": {"place": ["해변"]}, "status": "general", "src": []}, {"id": "t182", "sec": 20, "text": "해수욕장 샤워장·탈의실은 개장 기간에만 여는 곳이 많음", "sub": "개장 기간이 아니면 안전요원도 없는 경우가 많음", "tags": {"place": ["해변"]}, "status": "general", "src": []}, {"id": "t183", "sec": 16, "text": "섬은 배 시간이 곧 일정 — 마지막 배 시각부터 확인", "sub": "놓치면 하룻밤 묵어야 함", "tags": {"place": ["섬"]}, "status": "general", "src": []}, {"id": "t184", "sec": 4, "text": "섬은 현금·ATM이 귀한 곳이 있음", "sub": "작은 가게·민박은 계좌이체만 받기도", "tags": {"place": ["섬"]}, "status": "general", "src": []}, {"id": "t185", "sec": 19, "text": "섬 식당은 일찍 닫거나 쉬는 날이 많음", "sub": "끼니를 챙길 곳을 미리 확인", "tags": {"place": ["섬"]}, "status": "general", "src": []}, {"id": "t186", "sec": 16, "text": "축제는 첫날·주말 저녁이 가장 붐빔", "sub": "평일 낮이 한산", "tags": {"place": ["축제"]}, "status": "general", "src": []}, {"id": "t187", "sec": 5, "text": "축제장 주변은 교통 통제 — 임시 주차장·셔틀버스 확인", "sub": "행사장 가까운 도로는 차량 진입이 막힘", "tags": {"place": ["축제"]}, "status": "general", "src": []}, {"id": "t188", "sec": 23, "text": "일행과 만날 장소를 미리 정하기", "sub": "인파가 몰리면 통신이 느려지거나 끊기기도", "tags": {"place": ["축제"]}, "status": "general", "src": []}, {"id": "t189", "sec": 22, "text": "저체온증·동상이 의심되면 따뜻한 곳으로, 젖은 옷 벗기기", "sub": "담요로 감싸고 동상 부위는 따뜻한 물에 담근 뒤 빨리 진료", "tags": {"weather": ["추운 날"]}, "status": "ok", "src": ["cold"]}, {"id": "t190", "sec": 22, "text": "추운 날 술은 위험 — 추위를 덜 느끼게 함", "sub": "한랭질환 신고 환자의 21.3%가 음주 상태(2024–2025절기)", "tags": {"weather": ["추운 날"]}, "status": "ok", "src": ["cold"]}, {"id": "t191", "sec": 22, "text": "빙판길은 보폭을 줄이고 주머니에서 손 빼기", "sub": "넘어질 때 손으로 짚어야 덜 다침", "tags": {"weather": ["추운 날"]}, "status": "general", "src": []}, {"id": "t192", "sec": 16, "text": "겨울엔 해가 빨리 짐 — 야외 일정을 일찍 끝내기", "sub": "해가 지면 기온이 빠르게 떨어지고 길도 어두워짐", "tags": {"weather": ["추운 날"]}, "status": "general", "src": []}, {"id": "t193", "sec": 4, "text": "전통시장 온누리상품권 할인 혜택", "sub": "2026.10 개편 발표 — 전통시장 사용 시 구매 할인+사용 후 환급 합계 10% 추진(단계적 시행)", "tags": {"region": ["국내"], "place": ["시장"]}, "status": "check", "src": ["onnuri"]}, {"id": "t194", "sec": 19, "text": "시장은 오전에 물건이 많고, 오후 늦게 닫는 가게가 있음", "sub": "물건이 팔리면 일찍 문을 닫는 가게도 있음", "tags": {"place": ["시장"]}, "status": "general", "src": []}, {"id": "t195", "sec": 21, "text": "시장에서 사진 찍기 전엔 상인에게 한마디", "sub": "얼굴이 나오는 촬영을 싫어하는 상인도 있음", "tags": {"place": ["시장"]}, "status": "general", "src": []}, {"id": "t196", "sec": 25, "text": "어르신 동행은 화장실 간격을 짧게", "sub": "화장실을 오래 참기 어려운 경우가 많음", "tags": {"companion": ["어르신"]}, "status": "general", "src": []}, {"id": "t197", "sec": 25, "text": "복용약 시간에 맞춰 식사 시간 잡기", "sub": "식사 전후로 먹어야 하는 약이 있음", "tags": {"companion": ["어르신"]}, "status": "general", "src": []}, {"id": "t198", "sec": 22, "text": "더운 날 어르신은 시간을 정해 물 드리기", "sub": "나이가 들수록 갈증을 늦게 느낌", "tags": {"companion": ["어르신"], "weather": ["더운 날"]}, "status": "general", "src": []}, {"id": "t199", "sec": 16, "text": "어르신 동행은 하루 핵심 장소 2~3곳", "sub": "이동·휴식 시간이 길어짐", "tags": {"companion": ["어르신"]}, "status": "general", "src": []}, {"id": "t200", "sec": 26, "text": "해외 카드 결제는 현지 통화로", "sub": "원화로 결제하면 약 3~8% 수수료가 더 붙을 수 있음. 카드사 '해외원화결제 차단' 서비스 신청", "tags": {}, "status": "ok", "src": ["dcc"]}, {"id": "t201", "sec": 26, "text": "여권 분실: 현지 경찰 신고 → 재외공관에서 분실 신고·재발급", "sub": "귀국이 급하면 긴급여권 가능 여부 문의. 경찰 분실증명서·여권용 사진·신분증 준비. 신고한 여권은 찾아도 못 씀", "tags": {}, "status": "ok", "src": ["passport_lost", "passport_lost2"]}, {"id": "t202", "sec": 26, "text": "여권·항공권 사본을 휴대전화와 종이로 따로 보관", "sub": "분실 때 재발급·신고가 빨라짐", "tags": {}, "status": "general", "src": []}, {"id": "t203", "sec": 26, "text": "여행자보험 가입", "sub": "해외 병원비는 국내보다 훨씬 비쌀 수 있음 — 보장 범위·청구 서류 확인", "tags": {}, "status": "general", "src": []}, {"id": "t204", "sec": 26, "text": "카드는 2장 이상, 카드사 해외 분실신고 번호 저장", "sub": "한 장을 잃어버려도 결제 수단이 남음", "tags": {}, "status": "general", "src": []}, {"id": "t205", "sec": 26, "text": "소매치기는 사람 많은 곳·대중교통에서 — 가방은 앞으로", "sub": "붐비는 곳에선 몸이 부딪혀도 눈치채기 어려움", "tags": {}, "status": "general", "src": []}, {"id": "t206", "sec": 26, "text": "시차가 크면 도착 첫날 일정은 가볍게", "sub": "몸이 현지 시간에 맞춰지는 데 며칠이 걸림", "tags": {}, "status": "general", "src": []}, {"id": "t207", "sec": 26, "text": "경유편은 수하물이 최종 목적지까지 가는지 확인", "sub": "따로 끊은 항공권이면 짐을 찾아 다시 부쳐야 함", "tags": {"transport": ["항공"]}, "status": "general", "src": []}, {"id": "t208", "sec": 26, "text": "상비약은 원래 포장째로", "sub": "나라마다 반입을 제한하는 성분이 있음", "tags": {}, "status": "general", "src": []}, {"id": "t209", "sec": 10, "text": "택시 심야할증은 지역마다 시간·할증률이 다름", "sub": "대도시는 가장 늦은 시간대에 할증을 더 높이기도(20%→40%). 시 경계를 넘으면 시계외 할증이 붙는 곳도", "tags": {"region": ["국내"]}, "status": "ok", "src": ["taxi"]}]};
const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const secMap = Object.fromEntries(D.sections.map(s => [s.n, s]));
const STATUS = {ok:["검증","b-ok"], general:["일반 원칙","b-general"], check:["확인 필요","b-check"]};
const sel = {}; D.axes.forEach(a => sel[a.key] = new Set());

$("#ttl").textContent = D.title;
$("#sub").textContent = "조건을 고르면 공통 팁이 여행 흐름 순서로 모입니다 · 갱신 " + D.updated;

document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === b.dataset.tab));
}));

function tipLi(t, showSec){
  const li = el("li");
  const m = el("div", "t-main", t.text);
  const [lab, cls] = STATUS[t.status];
  m.appendChild(el("span", "badge " + cls, lab));
  li.appendChild(m);
  if (t.sub) li.appendChild(el("div", "t-sub", t.sub));
  if (t.src.length){
    const s = el("div", "t-src", "출처: ");
    t.src.forEach((k, i) => {
      const [name, url, date] = D.sources[k];
      const a = el("a", null, name + " (" + date + ")"); a.href = url; a.target = "_blank"; a.rel = "noopener";
      if (i) s.appendChild(document.createTextNode(" · "));
      s.appendChild(a);
    });
    li.appendChild(s);
  }
  return li;
}

// ── 조립 화면 ──
D.axes.forEach(a => {
  const w = el("div", "axis"); w.appendChild(el("div", "axis-label", a.label));
  const c = el("div", "chips");
  a.vals.forEach(v => {
    const b = el("button", "chip", v); b.dataset.axis = a.key; b.dataset.val = v;
    b.addEventListener("click", () => { sel[a.key].has(v) ? sel[a.key].delete(v) : sel[a.key].add(v); syncChips(); render(); });
    c.appendChild(b);
  });
  w.appendChild(c); $("#axes").appendChild(w);
});
Object.entries(D.presets).forEach(([name, cfg]) => {
  const b = el("button", "btn", name);
  b.addEventListener("click", () => { D.axes.forEach(a => sel[a.key] = new Set(cfg[a.key] || [])); syncChips(); render(); });
  $("#presets").appendChild(b);
});
$("#reset").addEventListener("click", () => { D.axes.forEach(a => sel[a.key].clear()); $("#q").value = ""; syncChips(); render(); });
$("#q").addEventListener("input", render);
function syncChips(){ document.querySelectorAll(".chip").forEach(b => b.classList.toggle("on", sel[b.dataset.axis].has(b.dataset.val))); }

function need(sec, tags){ const r = Object.assign({}, sec.req, tags); return r; }
function fits(req){ return Object.entries(req).every(([k, vs]) => vs.some(v => sel[k].has(v))); }

const isBasic = t => Object.keys(need(secMap[t.sec], t.tags)).length === 0;

function render(){
  const out = $("#result"); out.innerHTML = "";
  const q = $("#q").value.trim();
  const any = D.axes.some(a => sel[a.key].size) || q;
  if (!any){ out.appendChild(el("div", "empty", "위에서 조건을 고르거나 검색어를 입력하세요. 예시 버튼을 눌러 보면 작동 방식을 볼 수 있습니다.")); return; }
  const hit = D.tips.filter(t => {
    const sec = secMap[t.sec];
    if (q) return (t.text + t.sub + sec.name).includes(q);
    return !isBasic(t) && fits(need(sec, t.tags));
  });
  const blocks = [];
  [...new Set(hit.map(t => t.sec))].forEach(n => {
    const s = secMap[n], box = el("div", "box");
    const h = el("div", "sec-h", n + ". " + s.name); h.appendChild(el("small", null, D.groups[s.group])); box.appendChild(h);
    const ul = el("ul", "tips"); hit.filter(t => t.sec === n).forEach(t => ul.appendChild(tipLi(t))); box.appendChild(ul);
    blocks.push([s.order, box]);
  });
  blocks.sort((a, b) => a[0] - b[0]);
  out.appendChild(el("div", "count", "팁 " + hit.length + "개 · 섹션 " + blocks.length + "개"));
  blocks.forEach(b => out.appendChild(b[1]));
  if (!q){
    const pend = D.sections.filter(s => Object.keys(s.req).length && fits(s.req) && !D.tips.some(t => t.sec === s.n))
      .sort((a, b) => a.order - b.order).map(s => s.n + ". " + s.name);
    out.appendChild(el("div", "pending", "조건과 관계없이 늘 통하는 팁 " + D.tips.filter(isBasic).length + "개는 '기본 팁' 탭에 있습니다."));
    if (pend.length) out.appendChild(el("div", "pending", "조건에 해당하지만 아직 내용이 없는 섹션: " + pend.join(", ")));
    if (sel.region.has("해외")) out.appendChild(el("div", "pending", "나라마다 다른 내용(입국 조건·화폐·전압 등)은 자료창고 26번의 '새 나라 조사 점검표'로 출발 전에 조사하세요."));
  }
  if (!blocks.length) out.appendChild(el("div", "empty", "해당하는 팁이 아직 없습니다."));
}
render();

// ── 기본 팁 ──
(() => {
  const basic = D.tips.filter(isBasic);
  [...new Set(basic.map(t => t.sec))].sort((a, b) => secMap[a].order - secMap[b].order).forEach(n => {
    const s = secMap[n], box = el("div", "box");
    const h = el("div", "sec-h", n + ". " + s.name); h.appendChild(el("small", null, D.groups[s.group])); box.appendChild(h);
    const ul = el("ul", "tips"); basic.filter(t => t.sec === n).forEach(t => ul.appendChild(tipLi(t))); box.appendChild(ul);
    $("#basic").appendChild(box);
  });
})();

// ── 자료창고 ──
D.groups.forEach((g, gi) => {
  $("#store").appendChild(el("div", "grp-h", g));
  D.sections.filter(s => s.group === gi).forEach(s => {
    const tips = D.tips.filter(t => t.sec === s.n);
    const d = el("details", "sec"); const sm = el("summary");
    sm.appendChild(el("span", null, s.n + ". " + s.name));
    sm.appendChild(el("span", "cnt", tips.length ? "팁 " + tips.length + "개" : "준비 중"));
    d.appendChild(sm);
    const b = el("div", "sec-body");
    b.appendChild(el("div", "scope", "범위 · " + s.scope));
    if (s.approach.length){ b.appendChild(el("div", "lbl", "접근 방식")); const ol = el("ol", "plain"); s.approach.forEach(x => ol.appendChild(el("li", null, x))); b.appendChild(ol); }
    if (tips.length){ b.appendChild(el("div", "lbl", "공통 팁")); const ul = el("ul", "tips"); tips.forEach(t => ul.appendChild(tipLi(t))); b.appendChild(ul); }
    if (s.ment.length){ b.appendChild(el("div", "lbl", "멘트 예시")); s.ment.forEach(m => b.appendChild(el("div", "ment", m))); }
    if (s.caution.length){ b.appendChild(el("div", "lbl", "주의")); const ul = el("ul", "plain"); s.caution.forEach(x => ul.appendChild(el("li", null, x))); b.appendChild(ul); }
    if (s.checklist.length){ b.appendChild(el("div", "lbl", "새 나라 조사 점검표")); const ol = el("ol", "plain"); s.checklist.forEach(x => ol.appendChild(el("li", null, x))); b.appendChild(ol); }
    if (!tips.length && !s.approach.length) b.appendChild(el("div", "pending", "다음 단계에서 채울 섹션입니다."));
    d.appendChild(b); $("#store").appendChild(d);
  });
});

</script>
</body>
